name: Monitor Concursos TI

on:
  schedule:
    # 10:55 UTC = 07:55 Horário de Brasília (UTC-3)
    # Rodar aos 55 minutos evita a fila cheia das horas em ponto (:00) no GitHub Actions,
    # garantindo que o bot execute pontualmente por volta das 08:00.
    # Segundas (1), Quartas (3) e Sextas (5)
    - cron: '55 10 * * 1,3,5'
  workflow_dispatch: # Permite disparar manualmente pelo botão "Run workflow" no GitHub

jobs:
  executar-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar o bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
